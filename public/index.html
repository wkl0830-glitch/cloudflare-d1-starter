<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare D1 快速入門示範</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- 頂部導航 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
          <i class="fa-solid fa-cloud text-white text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-orange-400 to-amber-200 bg-clip-text text-transparent">Cloudflare + D1</h1>
          <p class="text-xs text-slate-400">OpenCode 自動建置範本</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span id="dbStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          D1 連線正常
        </span>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

    <!-- 新增卡片 -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-orange-400"></i> 新增記事或任務
      </h2>
      <form id="addItemForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">標題</label>
          <input 
            type="text" 
            id="itemTitle" 
            required 
            placeholder="例如：完成 Cloudflare 部署教學..." 
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition text-sm"
          >
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">詳細備註（選填）</label>
          <textarea 
            id="itemContent" 
            rows="2" 
            placeholder="輸入更多詳細內容..." 
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition text-sm resize-none"
          ></textarea>
        </div>
        <div class="flex justify-end">
          <button 
            type="submit" 
            id="submitBtn"
            class="inline-flex items-center gap-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-orange-500/25 transition cursor-pointer text-sm"
          >
            <i class="fa-solid fa-paper-plane"></i> 新增至 D1 資料庫
          </button>
        </div>
      </form>
    </div>

    <!-- 項目清單 -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-md font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-database text-amber-400"></i> 資料庫內容
          <span id="itemCount" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">0</span>
        </h3>
        <button id="refreshBtn" class="text-xs text-slate-400 hover:text-slate-200 transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-arrows-rotate"></i> 重新載入
        </button>
      </div>

      <div id="loading" class="text-center py-12 text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-orange-500"></i>
        <p class="text-sm">正在從 D1 讀取資料...</p>
      </div>

      <div id="itemList" class="space-y-3"></div>

      <div id="emptyState" class="hidden text-center py-12 bg-slate-800/30 border border-dashed border-slate-800 rounded-2xl">
        <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
        <p class="text-slate-400 text-sm">目前資料庫沒有任何資料，快建立第一筆吧！</p>
      </div>
    </div>
  </main>

  <footer class="text-center py-6 border-t border-slate-800/80 text-xs text-slate-500">
    Power by Cloudflare Workers • D1 Database • Hono • OpenCode
  </footer>

  <script>
    const form = document.getElementById('addItemForm');
    const titleInput = document.getElementById('itemTitle');
    const contentInput = document.getElementById('itemContent');
    const itemList = document.getElementById('itemList');
    const loading = document.getElementById('loading');
    const emptyState = document.getElementById('emptyState');
    const itemCount = document.getElementById('itemCount');
    const refreshBtn = document.getElementById('refreshBtn');

    // 載入資料
    async function fetchItems() {
      loading.classList.remove('hidden');
      itemList.innerHTML = '';
      emptyState.classList.add('hidden');

      try {
        const res = await fetch('/api/items');
        const json = await res.json();

        loading.classList.add('hidden');

        if (!json.success || !json.data || json.data.length === 0) {
          emptyState.classList.remove('hidden');
          itemCount.innerText = '0';
          return;
        }

        itemCount.innerText = json.data.length;
        renderItems(json.data);
      } catch (err) {
        loading.classList.add('hidden');
        alert('載入失敗：' + err.message);
      }
    }

    // 渲染清單
    function renderItems(items) {
      itemList.innerHTML = '';
      items.forEach(item => {
        const isDone = item.status === 'completed';
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition flex items-start justify-between gap-4 ${
          isDone 
            ? 'bg-slate-800/30 border-slate-800/80 text-slate-500' 
            : 'bg-slate-800/80 border-slate-700/80 text-slate-100 hover:border-slate-600'
        }`;

        card.innerHTML = `
          <div class="flex items-start gap-3 flex-1 min-w-0">
            <button onclick="toggleStatus(${item.id}, '${item.status}')" class="mt-1 text-slate-400 hover:text-orange-400 transition cursor-pointer">
              <i class="${isDone ? 'fa-solid fa-circle-check text-emerald-400 text-lg' : 'fa-regular fa-circle text-lg'}"></i>
            </button>
            <div class="flex-1 min-w-0">
              <h4 class="font-medium text-sm md:text-base leading-snug break-words ${isDone ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h4>
              ${item.content ? `<p class="text-xs md:text-sm text-slate-400 mt-1 break-words">${escapeHtml(item.content)}</p>` : ''}
              <div class="text-[11px] text-slate-500 mt-2 flex items-center gap-3">
                <span>#${item.id}</span>
                <span>${new Date(item.created_at).toLocaleString()}</span>
              </div>
            </div>
          </div>
          <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10 transition cursor-pointer">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        `;
        itemList.appendChild(card);
      });
    }

    // 新增
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title) return;

      try {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        const data = await res.json();
        if (data.success) {
          titleInput.value = '';
          contentInput.value = '';
          fetchItems();
        } else {
          alert('新增失敗：' + data.error);
        }
      } catch (err) {
        alert('發送錯誤：' + err.message);
      }
    });

    // 切換狀態
    window.toggleStatus = async (id, currentStatus) => {
      const nextStatus = currentStatus === 'completed' ? 'pending' : 'completed';
      try {
        await fetch(`/api/items/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: nextStatus })
        });
        fetchItems();
      } catch (err) {
        alert('更新失敗：' + err.message);
      }
    };

    // 刪除
    window.deleteItem = async (id) => {
      if (!confirm('確定要刪除這筆資料嗎？')) return;
      try {
        await fetch(`/api/items/${id}`, { method: 'DELETE' });
        fetchItems();
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    };

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    refreshBtn.addEventListener('click', fetchItems);
    fetchItems();
  </script>
</body>
</html>
